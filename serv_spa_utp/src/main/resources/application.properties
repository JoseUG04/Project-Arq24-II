#aplicacion:
spring.application.name=serv_spa_utp
#puerto:
server.port=8081
#contexto de aplicaci\u00f3n
spring.devtools.livereload.enabled=true
server.servlet.context-path=/spa
logging.level.org.springframework=INFO
logging.level.com.example.serv_spa_utp=DEBUG

#Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/spautp?useSSL=false&serverTimezone=UTC
    #credenciales - MySQL
    spring.datasource.username=root
    spring.datasource.password=
    #driver
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
